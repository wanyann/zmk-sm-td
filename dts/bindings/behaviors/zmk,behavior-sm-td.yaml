description: SM Tap-Dance Behavior
compatible: "zmk,behavior-sm-td"
include: two_param.yaml
properties:
  bindings:
    type: phandles
    required: true
  tap-term-ms:
    type: int
    default: 200
  sequence-term-ms:
    type: int
    default: 100
  release-term-ms:
    type: int
    default: 50
  release-percent:
    type: int
    default: 30
  aggregate-taps:
    type: boolean